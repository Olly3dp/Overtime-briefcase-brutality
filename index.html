<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERTIME: Briefcase Brutality - Arcade Humanoid Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050508;
            color: #f0e6d2;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 6px;
            font-size: 1.3rem;
            color: #ff0055;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(255, 0, 85, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #game-wrapper {
            position: relative;
            border: 4px solid #222233;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 0, 85, 0.3);
            background: #000;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
        }
        .controls-bar {
            margin-top: 8px;
            font-size: 0.76rem;
            color: #a0a0b0;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
        .controls-bar span {
            color: #00ffff;
            font-weight: bold;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>OVERTIME: BRIEFCASE BRUTALITY (HUMANOID ARCADE)</h1>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="scanlines"></div>
    </div>
    <div class="controls-bar">
        <span>MOVER:</span> A/D ou Setas | <span>PULAR:</span> Espaço / W | <span>GOLPE:</span> Z / J | <span>MALETA BOOMERANG:</span> X / K | <span>DASH:</span> C / L | <span>DEFESA:</span> V / I
    </div>

<script>
/**
 * OVERTIME: BRIEFCASE BRUTALITY - INFINITE POST-APOCALYPTIC CITY EDITION
 * Infinite procedural level generation, fixed item pickup physics, 
 * KOF/Total Carnage arcade humanoid sprites, and continuous stage progression.
 */

// --- AUDIO SYNTHESIZER ---
class RetroAudioEngine {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
    }
    playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.08);
    }
    playBoomerang() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
    }
    playParry() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(250, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.18);
    }
    playItem() {
        if (!this.ctx) return;
        [523, 659, 783, 1046].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime + idx * 0.04);
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.04);
            osc.stop(this.ctx.currentTime + 0.18);
        });
    }
}
const audio = new RetroAudioEngine();

// --- CANVAS & GAME STATES ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const STATE_MENU = 0;
const STATE_PLAYING = 1;
const STATE_GAMEOVER = 2;
const STATE_STAGE_CLEAR = 3;
const STATE_VICTORY_ALL = 4;

let gameState = STATE_MENU;
let currentStage = 1;
let unlockedStage = 1;
let cameraX = 0;
let flashEffect = 0;

// Inputs
const keys = {};
window.addEventListener("keydown", (e) => {
    audio.init();
    keys[e.code] = true;
    
    if (gameState === STATE_MENU && e.code === "Enter") {
        gameState = STATE_PLAYING;
        initStage(currentStage);
    } else if (gameState === STATE_STAGE_CLEAR && e.code === "Enter") {
        if (currentStage < 20) {
            currentStage++;
            unlockedStage = Math.max(unlockedStage, currentStage);
            initStage(currentStage);
            gameState = STATE_PLAYING;
        } else {
            gameState = STATE_VICTORY_ALL;
        }
    } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY_ALL) && e.code === "Enter") {
        currentStage = 1;
        gameState = STATE_MENU;
    }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

// --- STAGE DATA ---
const STAGE_CONFIGS = [
    { name: "1: RUÍNAS DE NEO-CIDADE", bg: "#090511", sky: "#1b092b", boss: "MUTANTE CARNIFICINA", hp: 250, color: "#e74c3c" },
    { name: "2: DISTRITO EM CHAMAS", bg: "#160505", sky: "#380a0a", boss: "EXAMINADOR DE FERRO", hp: 300, color: "#d35400" },
    { name: "3: VIADUTO DA MORTE", bg: "#050b16", sky: "#0a1936", boss: "TERRY DEMÔNIO - CORRUPTO", hp: 350, color: "#2980b9" },
    { name: "4: ZONA INDUSTRIAL TÓXICA", bg: "#05160b", sky: "#0a3617", boss: "ESPECTRO BIOLÓGICO", hp: 400, color: "#27ae60" },
    { name: "5: TORRE DO CONSELHO INFERNAL", bg: "#15051a", sky: "#330a3d", boss: "WARHEAD - FORMA BASE", hp: 500, color: "#8e44ad" },
    { name: "6: SUBTERRÂNEO ABANDONADO", bg: "#111111", sky: "#262626", boss: "CARCAGEIRO SUBTERRÂNEO", hp: 550, color: "#7f8c8d" },
    { name: "7: AUTOESTRADA APOCALÍPTICA", bg: "#1a0f05", sky: "#3d220a", boss: "MOTOCICLISTA DO ABISMO", hp: 600, color: "#f39c12" },
    { name: "8: CRIPTA DA BUROCRACIA", bg: "#160510", sky: "#380a29", boss: "SUPERVISOR DAS SOMBRAS", hp: 650, color: "#c0392b" },
    { name: "9: LABORATÓRIO CYBERNETICO", bg: "#05141a", sky: "#0a303d", boss: "CYBORG ASASSINO V2", hp: 700, color: "#16a085" },
    { name: "10: NÚCLEO DE REATORES", bg: "#1a0505", sky: "#4a0000", boss: "O GERENTE ATÔMICO", hp: 800, color: "#ff0000" },
    { name: "11: DESTRUIÇÃO NO ARRANHA-CÉU", bg: "#0a0a1a", sky: "#181842", boss: "EXECUTOR ALADO", hp: 850, color: "#34495e" },
    { name: "12: ESGOTO SANGRENTO", bg: "#101605", sky: "#26380a", boss: "REI DOS DEJETOS", hp: 900, color: "#1abc9c" },
    { name: "13: PRAÇA DA CHUVA ÁCIDA", bg: "#05131a", sky: "#0a2b38", boss: "RYO DAS CHAMAS NEGRAS", hp: 950, color: "#2980b9" },
    { name: "14: BASE MILITAR DESTRUÍDA", bg: "#131405", sky: "#2d300a", boss: "TANQUE DEMONÍACO", hp: 1000, color: "#f1c40f" },
    { name: "15: CÚPULA DOS ACIONISTAS", bg: "#180518", sky: "#3b0a3b", boss: "SOCIEDADE DAS SOMBRAS", hp: 1100, color: "#9b59b6" },
    { name: "16: PORTAL DA EXTRAÇÃO", bg: "#1a0805", sky: "#42130a", boss: "GUARDIÃO DO PORTAL", hp: 1200, color: "#e67e22" },
    { name: "17: CAMPO DE BATALHA FINAL", bg: "#1a0000", sky: "#4a0000", boss: "GENERAL DA CARNIFICINA", hp: 1300, color: "#c0392b" },
    { name: "18: CORREDOR DO FIM", bg: "#050505", sky: "#1f1f1f", boss: "AVATAR DA DESTRUIÇÃO", hp: 1400, color: "#bdc3c7" },
    { name: "19: ANEXO DA PRESIDÊNCIA", bg: "#12001a", sky: "#330047", boss: "VICE-PRESIDENTE INFERNAL", hp: 1500, color: "#8e44ad" },
    { name: "20: O TRONO DE WARHEAD", bg: "#1c000c", sky: "#520024", boss: "WARHEAD CEO - DEUS SUPREMO", hp: 1800, color: "#ff0055" }
];

// --- PLAYER (KAI - TOTAL CARNAGE / KOF STYLE) ---
let player = {
    x: 100, y: 300, w: 32, h: 56,
    vx: 0, vy: 0, speed: 5.2,
    hp: 100, maxHp: 100,
    stamina: 100, maxStamina: 100,
    facing: 1, grounded: false,
    combo: 0, attackTimer: 0,
    isDashing: false, dashTimer: 0,
    isParrying: false, parryTimer: 0,
    score: 0, damage: 35, animFrame: 0,
    distance: 0
};

let platforms = [];
let enemies = [];
let projectiles = [];
let particles = [];
let items = [];
let boomerang = null;
let boss = null;
let stagePortal = null;
let lastGeneratedX = 0;

function generateProceduralTerrain(fromX, toX) {
    let currentX = fromX;
    while (currentX < toX) {
        // Ground segment
        const groundW = 400 + Math.random() * 300;
        platforms.push({ x: currentX, y: 364, w: groundW, h: 90, type: 'ground' });

        // Elevated metal girders/ruins
        if (Math.random() > 0.3) {
            const platW = 120 + Math.random() * 100;
            const platY = 220 + Math.random() * 60;
            platforms.push({ x: currentX + 80, y: platY, w: platW, h: 16, type: 'girder' });

            // Spawn Item on girder
            if (Math.random() > 0.4) {
                const types = ['coffee', 'heal', 'relic'];
                items.push({
                    x: currentX + 110 + Math.random() * (platW - 40),
                    y: platY - 24,
                    w: 20, h: 20,
                    type: types[Math.floor(Math.random() * types.length)],
                    bob: Math.random() * 10
                });
            }
        }

        // Spawn Enemies
        if (Math.random() > 0.25 && currentX > 300) {
            enemies.push({
                x: currentX + 150, y: 310,
                w: 30, h: 52,
                hp: 60 + currentStage * 15, maxHp: 60 + currentStage * 15,
                type: Math.random() > 0.5 ? 'grunt' : 'brute',
                vx: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.min(2.5, currentStage * 0.1)),
                facing: -1
            });
        }

        currentX += groundW;
    }
    lastGeneratedX = toX;
}

function initStage(stageIdx) {
    const config = STAGE_CONFIGS[stageIdx - 1];
    player.x = 100; player.y = 300;
    player.vx = 0; player.vy = 0;
    player.hp = Math.min(player.maxHp, player.hp + 30);
    player.distance = 0;
    cameraX = 0;

    projectiles = [];
    particles = [];
    items = [];
    enemies = [];
    platforms = [];
    boomerang = null;
    stagePortal = null;

    lastGeneratedX = 0;
    generateProceduralTerrain(0, 2400);

    // Initial items near start
    items.push({ x: 250, y: 340, w: 20, h: 20, type: 'coffee', bob: 0 });
    items.push({ x: 450, y: 340, w: 20, h: 20, type: 'heal', bob: 0 });

    // Boss spawns continuously further out based on stage
    boss = {
        x: 1800 + stageIdx * 100, y: 300, w: 40, h: 64,
        hp: config.hp, maxHp: config.hp,
        name: config.boss, color: config.color,
        vx: -1.8, vy: 0, timer: 0, facing: -1,
        active: false
    };
}

function spawnFX(x, y, color = "#ff0055", count = 8) {
    for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 5;
        particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 2 + Math.random() * 4,
            color: color, life: 1.0, decay: 0.04
        });
    }
}

// --- UPDATE LOOP ---
function updateGame() {
    if (gameState !== STATE_PLAYING) return;

    player.animFrame += 0.18;
    player.distance = Math.max(player.distance, Math.floor(player.x));

    // Dynamic infinite generation as player advances
    if (player.x + 1600 > lastGeneratedX) {
        generateProceduralTerrain(lastGeneratedX, lastGeneratedX + 1600);
    }

    // Player Actions
    if (player.isDashing) {
        player.dashTimer--;
        player.vx = player.facing * 9.5;
        if (player.dashTimer <= 0) player.isDashing = false;
    } else if (player.isParrying) {
        player.parryTimer--;
        player.vx = 0;
        if (player.parryTimer <= 0) player.isParrying = false;
    } else {
        if (keys["ArrowLeft"] || keys["KeyA"]) { player.vx = -player.speed; player.facing = -1; }
        else if (keys["ArrowRight"] || keys["KeyD"]) { player.vx = player.speed; player.facing = 1; }
        else player.vx *= 0.65;

        // Jump
        if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
            player.vy = -11.5;
            player.grounded = false;
        }

        // Dash (C or L)
        if ((keys["KeyC"] || keys["KeyL"]) && player.stamina >= 20 && !player.isDashing) {
            player.isDashing = true;
            player.dashTimer = 14;
            player.stamina -= 20;
            spawnFX(player.x, player.y + 20, "#00ffff", 6);
        }

        // Parry/Guard (V or I)
        if ((keys["KeyV"] || keys["KeyI"]) && !player.isParrying) {
            player.isParrying = true;
            player.parryTimer = 18;
        }

        // Melee Strike (Z or J)
        if ((keys["KeyZ"] || keys["KeyJ"]) && player.attackTimer <= 0) {
            player.attackTimer = 11;
            audio.playHit();

            // Hit Regular Enemies
            enemies.forEach(en => {
                if (Math.abs((player.x + player.facing * 35) - en.x) < 45 && Math.abs(player.y - en.y) < 40) {
                    en.hp -= player.damage;
                    player.score += 50;
                    spawnFX(en.x, en.y + 20, "#ff0055", 10);
                }
            });

            // Hit Boss
            if (boss && boss.active && boss.hp > 0 && Math.abs((player.x + player.facing * 35) - boss.x) < 55 && Math.abs(player.y - boss.y) < 45) {
                boss.hp -= player.damage;
                player.score += 100;
                flashEffect = 3;
                spawnFX(boss.x, boss.y + 20, "#ff0055", 14);
            }
        }

        // Throw Briefcase Boomerang (X or K)
        if ((keys["KeyX"] || keys["KeyK"]) && !boomerang && player.stamina >= 15) {
            player.stamina -= 15;
            audio.playBoomerang();
            boomerang = {
                x: player.x + player.facing * 20,
                y: player.y + 10,
                vx: player.facing * 10.5,
                returning: false,
                startX: player.x
            };
        }
    }

    if (player.attackTimer > 0) player.attackTimer--;
    if (player.stamina < player.maxStamina) player.stamina += 0.5;

    // Physics
    player.vy += 0.58;
    player.x += player.vx;
    player.y += player.vy;

    // Pitfall Check (Respawn on ground if fallen)
    if (player.y > 450) {
        player.hp -= 20;
        player.y = 280;
        player.vy = 0;
        spawnFX(player.x, player.y, "#ff0000", 12);
    }

    // Platform Collision logic
    player.grounded = false;
    platforms.forEach(plat => {
        if (player.x + player.w > plat.x && player.x < plat.x + plat.w) {
            if (player.y + player.h >= plat.y && player.y + player.h <= plat.y + 18 && player.vy >= 0) {
                player.y = plat.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    // Level Boundaries (Left only, Right is Infinite)
    player.x = Math.max(10, player.x);

    // Camera Follows Player smoothly
    cameraX = Math.max(0, player.x - 250);

    // Activate Boss when player gets close
    if (boss && boss.hp > 0 && Math.abs(player.x - boss.x) < 600) {
        boss.active = true;
    }

    // --- REGULAR ENEMIES LOGIC ---
    enemies.forEach((en, idx) => {
        if (en.hp <= 0) {
            // Drop guaranteed item on death
            if (Math.random() > 0.4) {
                items.push({
                    x: en.x, y: en.y + 10, w: 20, h: 20,
                    type: Math.random() > 0.5 ? 'heal' : 'coffee', bob: 0
                });
            }
            enemies.splice(idx, 1);
            player.score += 200;
            spawnFX(en.x, en.y, "#ff0055", 12);
            return;
        }

        // Patrol
        en.x += en.vx;
        if (Math.random() < 0.01) en.vx *= -1;
        en.facing = Math.sign(en.vx) || -1;

        // Enemy Attack Player
        if (!player.isDashing && Math.hypot(en.x - player.x, en.y - player.y) < 28) {
            if (player.isParrying) {
                audio.playParry();
                en.hp -= 35;
                spawnFX(en.x, en.y, "#ffffff", 12);
            } else {
                player.hp -= 0.6;
                spawnFX(player.x, player.y, "#ff0000", 2);
            }
        }
    });

    // --- BOOMERANG LOGIC ---
    if (boomerang) {
        if (!boomerang.returning) {
            boomerang.x += boomerang.vx;
            if (Math.abs(boomerang.x - boomerang.startX) > 300) {
                boomerang.returning = true;
            }
        } else {
            const dx = (player.x + 10) - boomerang.x;
            boomerang.x += Math.sign(dx) * 9.5;
            if (Math.abs((player.x + 10) - boomerang.x) < 20) boomerang = null;
        }

        if (boomerang) {
            enemies.forEach(en => {
                if (Math.hypot(boomerang.x - en.x, boomerang.y - en.y) < 30) {
                    en.hp -= 30;
                    boomerang.returning = true;
                    spawnFX(en.x, en.y, "#00ffff", 8);
                }
            });

            if (boss && boss.active && boss.hp > 0 && Math.hypot(boomerang.x - boss.x, boomerang.y - boss.y) < 35) {
                boss.hp -= 25;
                boomerang.returning = true;
                spawnFX(boss.x, boss.y, "#00ffff", 10);
            }
        }
    }

    // --- BOSS LOGIC ---
    if (boss && boss.active && boss.hp > 0) {
        boss.timer++;
        boss.facing = player.x < boss.x ? -1 : 1;
        boss.x += boss.facing * (1.2 + currentStage * 0.1);

        // Shoot Projectiles
        if (boss.timer % Math.max(30, 70 - currentStage * 2) === 0) {
            projectiles.push({
                x: boss.x, y: boss.y + 10,
                vx: boss.facing * 6.5,
                vy: (Math.random() - 0.5) * 2,
                color: boss.color
            });
        }

        // Boss Body Collision
        if (!player.isDashing && Math.hypot(boss.x - player.x, boss.y - player.y) < 32) {
            if (player.isParrying) {
                audio.playParry();
                boss.hp -= 40;
                spawnFX(boss.x, boss.y, "#ffffff", 16);
            } else {
                player.hp -= 0.8;
                spawnFX(player.x, player.y, "#ff0000", 3);
            }
        }
    }

    // Boss Defeated -> Spawn Exit Portal Right Ahead
    if (boss && boss.active && boss.hp <= 0) {
        player.score += 2500;
        stagePortal = { x: boss.x + 100, y: 275, w: 60, h: 90 };
        spawnFX(boss.x, boss.y, "#d4af37", 45);
        boss.active = false;
    }

    // Touch Exit Portal -> Triggers STAGE CLEAR immediately
    if (stagePortal && Math.hypot((player.x + player.w/2) - (stagePortal.x + stagePortal.w/2), (player.y + player.h/2) - (stagePortal.y + stagePortal.h/2)) < 50) {
        audio.playItem();
        gameState = STATE_STAGE_CLEAR;
    }

    // --- PROJECTILES LOGIC ---
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.y += p.vy;

        if (!player.isDashing && Math.hypot(p.x - player.x, p.y - player.y) < 20) {
            if (player.isParrying) {
                audio.playParry();
                projectiles.splice(i, 1);
                spawnFX(player.x, player.y, "#ffffff", 10);
            } else {
                player.hp -= 12;
                projectiles.splice(i, 1);
                spawnFX(player.x, player.y, "#ff0000", 6);
            }
        } else if (p.x < cameraX - 100 || p.x > cameraX + 900) {
            projectiles.splice(i, 1);
        }
    }

    // --- ITEM PICKUP FIX (AABB BOX & RADIUS CHECK) ---
    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.bob += 0.08;
        const currentY = it.y + Math.sin(it.bob) * 4;

        // Accurate AABB + Radius Collision for instant item pickup
        const playerCenterX = player.x + player.w / 2;
        const playerCenterY = player.y + player.h / 2;
        const dist = Math.hypot(it.x - playerCenterX, currentY - playerCenterY);

        if (dist < 40 || (player.x < it.x + it.w && player.x + player.w > it.x && player.y < currentY + it.h && player.y + player.h > currentY)) {
            audio.playItem();
            if (it.type === 'coffee') {
                player.stamina = player.maxStamina;
                spawnFX(player.x + 10, player.y, "#00ffff", 12);
            } else if (it.type === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + 40);
                spawnFX(player.x + 10, player.y, "#00ff66", 12);
            } else if (it.type === 'relic') {
                player.score += 750;
                spawnFX(player.x + 10, player.y, "#d4af37", 15);
            }
            items.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) particles.splice(i, 1);
    }

    if (player.hp <= 0) gameState = STATE_GAMEOVER;
}

// --- RENDER HUMANOID SPRITES (TOTAL CARNAGE / KOF STYLE) ---
function drawHumanoidKAI(ctx, x, y, facing, attackTimer, isDashing) {
    ctx.save();
    ctx.translate(x, y);
    if (facing === -1) ctx.scale(-1, 1);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.ellipse(0, 54, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Muscular Legs / Boots (Total Carnage Arcade Proportions)
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(-7, 26, 7, 26);
    ctx.fillRect(2, 26, 7, 26);
    ctx.fillStyle = "#ff0055"; // Neon Red Boots
    ctx.fillRect(-7, 46, 7, 8);
    ctx.fillRect(2, 46, 7, 8);

    // Torso / Vest (Terry Bogard Open Jacket Vibe)
    ctx.fillStyle = isDashing ? "#00ffff" : "#cc0044";
    ctx.fillRect(-10, 8, 20, 20);
    ctx.fillStyle = "#ffffff"; // White Inner Shirt
    ctx.fillRect(-4, 10, 8, 16);

    // Arms & Briefcase Weapon
    if (attackTimer > 0) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(8, 2, 28, 22); // Briefcase Slash Energy
        ctx.fillStyle = "#d4af37";
        ctx.fillRect(12, 6, 20, 14); // Metallic Briefcase Hit
    } else {
        ctx.fillStyle = "#442211"; // Briefcase Holstered
        ctx.fillRect(6, 18, 12, 16);
        ctx.fillStyle = "#d4af37";
        ctx.fillRect(8, 16, 8, 4);
    }

    // Head / Hair / Visor (Headband Style)
    ctx.fillStyle = "#f5d0a9"; // Skin Tone
    ctx.fillRect(-7, -6, 14, 14);
    ctx.fillStyle = "#ff0055"; // Red Headband / Visor
    ctx.fillRect(-8, -4, 16, 4);
    ctx.fillStyle = "#00ffff"; // Glowing Cyber Visor
    ctx.fillRect(1, -3, 6, 3);
    ctx.fillStyle = "#d4af37"; // Blond Spiky Hair (Ryo/Terry Style)
    ctx.fillRect(-8, -10, 16, 5);

    ctx.restore();
}

function drawHumanoidEnemy(ctx, en) {
    ctx.save();
    ctx.translate(en.x, en.y);
    if (en.facing === -1) ctx.scale(-1, 1);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 50, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = en.type === 'brute' ? "#800020" : "#2c3e50";
    ctx.fillRect(-10, 10, 20, 24);
    ctx.fillRect(-8, 34, 6, 16);
    ctx.fillRect(2, 34, 6, 16);

    // Head & Eyes
    ctx.fillStyle = "#111111";
    ctx.fillRect(-8, -4, 16, 14);
    ctx.fillStyle = "#ff0055";
    ctx.fillRect(2, 0, 5, 4);

    // Mutated Horns
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath();
    ctx.moveTo(-6, -4); ctx.lineTo(-14, -16); ctx.lineTo(-2, -4);
    ctx.moveTo(2, -4); ctx.lineTo(10, -16); ctx.lineTo(6, -4);
    ctx.fill();

    ctx.restore();
}

function drawHumanoidBoss(ctx, b) {
    if (!b || b.hp <= 0) return;
    ctx.save();
    ctx.translate(b.x, b.y);
    if (b.facing === -1) ctx.scale(-1, 1);

    // Boss Aura
    ctx.fillStyle = "rgba(255, 0, 85, 0.3)";
    ctx.beginPath();
    ctx.arc(0, 20, 42, 0, Math.PI * 2);
    ctx.fill();

    // Heavy Body
    ctx.fillStyle = b.color;
    ctx.fillRect(-16, 8, 32, 34);
    ctx.fillRect(-14, 42, 12, 22);
    ctx.fillRect(2, 42, 12, 22);

    // Armor Plates
    ctx.fillStyle = "#111122";
    ctx.fillRect(-22, 4, 12, 16);
    ctx.fillRect(10, 4, 12, 16);

    // Head & Crown
    ctx.fillStyle = "#000000";
    ctx.fillRect(-12, -12, 24, 20);
    ctx.fillStyle = "#ff0055";
    ctx.fillRect(-4, -4, 14, 6);

    ctx.restore();
}

// --- MAIN RENDER LOOP ---
function renderGame() {
    ctx.save();

    const config = STAGE_CONFIGS[currentStage - 1];

    // Sky & Background (Post-Apocalyptic City Parallax)
    ctx.fillStyle = config.sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === STATE_MENU) {
        ctx.fillStyle = "#ff0055";
        ctx.font = "bold 26px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("OVERTIME: BRIEFCASE BRUTALITY", canvas.width / 2, 120);
        
        ctx.fillStyle = "#00ffff";
        ctx.font = "16px 'Courier New'";
        ctx.fillText("CIDADE PÓS-APOCALÍPTICA INFINITA - 20 FASES DE DESTRUIÇÃO", canvas.width / 2, 160);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Courier New'";
        ctx.fillText("[ PRESS ENTER TO START GAME ]", canvas.width / 2, 290);

        ctx.restore();
        return;
    }

    // Camera Offset Translation
    ctx.translate(-cameraX, 0);

    // Background Post-Apocalyptic City Skyline (Parallax)
    ctx.fillStyle = config.bg;
    for (let i = -200; i < cameraX + 1200; i += 120) {
        const h = 180 + Math.sin(i * 0.01) * 60;
        ctx.fillRect(i, 364 - h, 85, h);
        ctx.fillStyle = "rgba(255, 0, 85, 0.15)";
        ctx.fillRect(i + 15, 364 - h + 20, 15, 15);
        ctx.fillRect(i + 45, 364 - h + 50, 15, 15);
        ctx.fillStyle = config.bg;
    }

    // Platforms & Girders
    platforms.forEach(plat => {
        if (plat.type === 'ground') {
            ctx.fillStyle = "#12131a";
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(plat.x, plat.y, plat.w, 4);
        } else {
            ctx.fillStyle = "#33374a";
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = "#00ffff";
            ctx.fillRect(plat.x, plat.y, plat.w, 3);
        }
    });

    // Exit Portal (Luminous Gate)
    if (stagePortal) {
        const pulse = Math.sin(Date.now() * 0.01) * 6;
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(stagePortal.x - pulse/2, stagePortal.y - pulse/2, stagePortal.w + pulse, stagePortal.h + pulse);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(stagePortal.x + 8, stagePortal.y + 8, stagePortal.w - 16, stagePortal.h - 16);

        ctx.fillStyle = "#00ffff";
        ctx.font = "bold 16px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText(">>> PORTAL DE SAÍDA <<<", stagePortal.x + 30, stagePortal.y - 20);
        ctx.fillText("[ ENTRE PARA A PRÓXIMA FASE ]", stagePortal.x + 30, stagePortal.y - 5);
        ctx.textAlign = "start";
    }

    // Render Items with Bright Glow
    items.forEach(it => {
        const currentY = it.y + Math.sin(it.bob) * 4;
        ctx.fillStyle = it.type === 'coffee' ? "#00ffff" : (it.type === 'heal' ? "#00ff66" : "#d4af37");
        ctx.beginPath();
        ctx.arc(it.x + 10, currentY + 10, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px 'Courier New'";
        ctx.fillText(it.type === 'coffee' ? "⚡" : (it.type === 'heal' ? "❤" : "★"), it.x + 5, currentY + 14);
    });

    // Regular Enemies
    enemies.forEach(en => drawHumanoidEnemy(ctx, en));

    // Boss
    if (boss && boss.active) drawHumanoidBoss(ctx, boss);

    // Player
    drawHumanoidKAI(ctx, player.x, player.y, player.facing, player.attackTimer, player.isDashing);

    // Boomerang
    if (boomerang) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(boomerang.x, boomerang.y, 22, 14);
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(boomerang.x + 2, boomerang.y + 2, 18, 4);
    }

    // Projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.fill();
    });

    // Particles
    particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        ctx.globalAlpha = 1.0;
    });

    ctx.restore();

    // --- HUD (Screen Space) ---
    if (gameState === STATE_PLAYING) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(10, 10, 380, 65);

        // Stage Name & Distance
        ctx.fillStyle = "#ff0055";
        ctx.font = "bold 13px 'Courier New'";
        ctx.fillText("FASE " + currentStage + ": " + config.name, 20, 26);

        // Player Health Bar
        ctx.fillStyle = "#222";
        ctx.fillRect(20, 34, 160, 10);
        ctx.fillStyle = "#00ff66";
        ctx.fillRect(20, 34, Math.max(0, (player.hp / player.maxHp) * 160), 10);

        // Player Stamina Bar
        ctx.fillStyle = "#222";
        ctx.fillRect(20, 48, 160, 8);
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(20, 48, Math.max(0, (player.stamina / player.maxStamina) * 160), 8);

        ctx.fillStyle = "#ffffff";
        ctx.font = "12px 'Courier New'";
        ctx.fillText("SCORE: " + player.score, 200, 44);
        ctx.fillText("DIST: " + player.distance + "m", 200, 58);

        // Boss Health Bar (Top Right)
        if (boss && boss.active && boss.hp > 0) {
            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.fillRect(440, 10, 350, 45);

            ctx.fillStyle = boss.color;
            ctx.font = "bold 12px 'Courier New'";
            ctx.fillText(boss.name, 450, 26);

            ctx.fillStyle = "#222";
            ctx.fillRect(450, 32, 330, 12);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(450, 32, Math.max(0, (boss.hp / boss.maxHp) * 330), 12);
        }

        // Objective Banner
        if (boss && boss.hp <= 0 && stagePortal) {
            ctx.fillStyle = "rgba(0, 255, 255, 0.9)";
            ctx.fillRect(200, 80, 400, 32);
            ctx.fillStyle = "#000000";
            ctx.font = "bold 14px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("CHEFE DERROTADO! ENTRE NO PORTAL À FRENTE!", 400, 101);
            ctx.textAlign = "start";
        }
    }

    // Flash Screen
    if (flashEffect > 0) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashEffect--;
    }

    // STAGE CLEAR SCREEN
    if (gameState === STATE_STAGE_CLEAR) {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ffff";
        ctx.font = "bold 32px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("FASE " + currentStage + " CONCLUÍDA!", canvas.width / 2, 160);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px 'Courier New'";
        ctx.fillText("PONTUAÇÃO ACUMULADA: " + player.score, canvas.width / 2, 220);

        if (currentStage < 20) {
            ctx.fillStyle = "#ff0055";
            ctx.font = "bold 20px 'Courier New'";
            ctx.fillText("[ PRESS ENTER FOR STAGE " + (currentStage + 1) + " ]", canvas.width / 2, 300);
        } else {
            ctx.fillStyle = "#d4af37";
            ctx.font = "bold 22px 'Courier New'";
            ctx.fillText("[ ENTER ] VER VITÓRIA FINAL", canvas.width / 2, 300);
        }
        ctx.textAlign = "start";
    }

    // GAMEOVER SCREEN
    if (gameState === STATE_GAMEOVER) {
        ctx.fillStyle = "rgba(0,0,0,0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff0055";
        ctx.font = "bold 34px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 180);

        ctx.fillStyle = "#ffffff";
        ctx.font = "16px 'Courier New'";
        ctx.fillText("OS DEMÔNIOS DOMINARAM A CIDADE", canvas.width / 2, 230);
        ctx.fillText("Pressione [ ENTER ] para recomeçar", canvas.width / 2, 310);
        ctx.textAlign = "start";
    }

    // VICTORY ALL STAGES SCREEN
    if (gameState === STATE_VICTORY_ALL) {
        ctx.fillStyle = "rgba(0,0,0,0.92)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#d4af37";
        ctx.font = "bold 30px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("TODAS AS 20 FASES FORAM DESTRUIDAS!", canvas.width / 2, 160);

        ctx.fillStyle = "#00ffff";
        ctx.font = "18px 'Courier New'";
        ctx.fillText("VOCÊ DERROTOU WARHEAD E SALVOU A CIDADE!", canvas.width / 2, 220);
        ctx.fillText("PONTUAÇÃO FINAL: " + player.score, canvas.width / 2, 260);

        ctx.fillStyle = "#ffffff";
        ctx.fillText("Pressione [ ENTER ] para retornar ao Menu", canvas.width / 2, 340);
        ctx.textAlign = "start";
    }
}

// --- GAME LOOP ---
function gameLoop() {
    updateGame();
    renderGame();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
